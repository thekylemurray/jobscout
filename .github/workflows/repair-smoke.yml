name: Repaired ATS Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/personal-2-2-1-trust-repairs
    paths:
      - src/jobscout/repair_probe.py
      - .github/workflows/repair-smoke.yml

jobs:
  verify-repaired-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Check public employer career APIs
        run: python -m jobscout.repair_probe
