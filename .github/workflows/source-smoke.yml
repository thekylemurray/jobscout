name: Public Source Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/personal-source-expansion
    paths:
      - src/jobscout/sources_expansion.py
      - src/jobscout/source_probe.py
      - .github/workflows/source-smoke.yml

jobs:
  read-only-endpoint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Verify public job feeds
        run: python -m jobscout.source_probe
